[workspace]
members = ["importer"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

# Tuwunel's own crates, pinned to the release the import is written for.
[workspace.dependencies.tuwunel_core]
git = "https://github.com/matrix-construct/tuwunel"
tag = "v1.9.4"

[workspace.dependencies.tuwunel_service]
git = "https://github.com/matrix-construct/tuwunel"
tag = "v1.9.4"

# The import only has to be correct, not fast: skip optimisation, as
# Tuwunel's dev profile does for its dependencies.
[profile.dev]
debug = 0

[profile.dev.package.'*']
debug = 0
opt-level = 1
incremental = false

# Copied from Tuwunel v1.9.4's Cargo.toml: patches only apply from the
# top-level workspace, so they have to be repeated here.
[patch.crates-io.rustyline-async]
git = "https://github.com/matrix-construct/rustyline-async"
rev = "879968ba99c2558ae234fd67a057b7ea6f761fd3"

# adds LIFO queue scheduling; this should be updated with PR progress.
[patch.crates-io.event-listener]
git = "https://github.com/matrix-construct/event-listener"
rev = "f2a3389999cbcb2bdda52dbf5493635a027e7d94"
[patch.crates-io.async-channel]
git = "https://github.com/matrix-construct/async-channel"
rev = "debb93f14a20fa7c1989042c2f07f53654d75908"

# adds affinity masks for selecting more than one core at a time
[patch.crates-io.core_affinity]
git = "https://github.com/matrix-construct/core_affinity_rs"
rev = "ff148c2985cbaff3e6e953d45cda4d7696f38d75"

# reverts hyperium#148 conflicting with our delicate federation resolver hooks
[patch.crates-io.hyper-util]
git = "https://github.com/matrix-construct/hyper-util"
rev = "0510e3a3cba7aedd504b4ee0d69fbf41e76a524f"

# allows no-aaaa option in resolv.conf
# bumps rust edition and toolchain to 1.86.0 and 2024
# use sat_add on line number errors
[patch.crates-io.resolv-conf]
git = "https://github.com/matrix-construct/resolv-conf"
rev = "ab5c3e44016bc76b8798ec837a5a9cf9d88bf233"

[patch.crates-io.rustls-platform-verifier]
git = "https://github.com/matrix-construct/rustls-platform-verifier"
rev = "c68093b6ac7d739e6b3aefb809c646a5e0210306"
