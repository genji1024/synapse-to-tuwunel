name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  migrate:
    # The Forgejo copy of this repository has a small runner; build only on
    # GitHub, where the repository is mirrored.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGPASSWORD: postgres
      TUWUNEL_VERSION: v1.9.4
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the importer
        run: cargo build
      - name: Download Tuwunel
        run: |
          name="$TUWUNEL_VERSION-release-all-x86_64-v1-linux-gnu-tuwunel.zst"
          curl -fsSL -o tuwunel.zst \
            "https://github.com/matrix-construct/tuwunel/releases/download/$TUWUNEL_VERSION/$name"
          zstd -d tuwunel.zst -o tuwunel
          chmod +x tuwunel
      - name: Migrate and check
        run: dev/e2e.sh "$RUNNER_TEMP/e2e" target/debug/synapse-to-tuwunel ./tuwunel
      - name: Logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e/*.log; do echo "== $f"; tail -n 100 "$f"; done
